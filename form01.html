<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Inscrição nos jogos escolares</h1>
        Preencha os campos abaixo com suas informações.
    </header><br>
    <main>
        <form>
            <fieldset>
                <legend> 1.Identificação do atleta</legend>
            <label for="nome-atleta">Nome completo do atleta (obrigatório)</label>
            <input type="text" id="nome-atleta" name="nome_atleta" required><br>

            <label for="nome-social">Nome social</label>
            <input type="text" id="nome-social" name="nome_social" required><br>

            <label for="matricula"> Matrícula (obrigatória)</label>
            <input type="text" id="matricula" name="matricula" required><br>

            <label for="data-nascimento"> Data de nascimento</label>
            <input type="date" id="data-nascimento" name="data-nascimento" required><br>

            <label for="email-atleta">E-mail de contato (obrigatório)</label>
            <input type="email" id="email-atleta" name="email_atleta" required><br>

            <label for="telefone-contato"> Telefone de contato</label>
            <input type="text" id="telefone-contato" name="telefone-contato"><br>

            <label for="site-escola">Site da escolar</label>
            <input type="" id="site-escola" name="site-escola"><br>
            </fieldset> <br>

            <fieldset>
                <legend>2. Escola e delegação</legend>
                <label for="escola-origem"> Escola de origem (com sugestões)</label>
                <input type="" id="escola-origem" name="escola-origem"> <br>

            </fieldset>

                        <fieldset>
                <label for="escola">Escola de origem</label>
                <input type="search" id="escola" name="escola" list="escolas">
                <datalist id="escolas">
                    <option value="Escola Horizonte"></option>
                    <option value="Escola Aurora"></option>
                    <option value="Escola Caminhos"></option>
                </datalist><br>

                <label for="turma">Turma</label>
                <input type="search" id="turma" name="turma" list="turmas">
                <datalist id="turmas">
                    <option value="8°"></option>
                    <option value="9°"></option>
                    <option value="1° Ensino médio"></option>
                    <option value="2° Ensino médio"></option>
                    <option value="3° Ensino médio"></option>
                </datalist><br>

            </fieldset>
        </form>
    </main>
    
</body>
</html>
